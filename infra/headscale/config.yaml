# Headscale v0.29 configuration for the Tesseract Network (ADR 0014).
# compose.yml overrides two values from .env through Headscale's HEADSCALE_* environment variables:
#   server_url      <- HEADSCALE_SERVER_URL      = ${TESSERACT_LOGIN_SERVER}
#   dns.base_domain <- HEADSCALE_DNS_BASE_DOMAIN = ${TESSERACT_NET_DOMAIN:-tesseract.internal}
# Reference: https://github.com/juanfont/headscale/blob/v0.29.7/config-example.yaml

server_url: https://net.example.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# The Docker networks the TLS proxy connects from.
trusted_proxies:
  - 172.16.0.0/12
  - 10.0.0.0/8
  - 192.168.0.0/16

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    # Served on server_url under /derp, so the TLS proxy must pass WebSocket/Upgrade requests through.
    enabled: true
    region_id: 999
    region_code: tesseract
    region_name: Tesseract
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  # Tailscale's public relays stay as a fallback; remove the URL to rely on the embedded relay only.
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: true

node:
  # Devices are removed through the account service (DELETE /v1/devices/:id, DELETE /v1/me), never by expiry.
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: tesseract.internal
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: false
