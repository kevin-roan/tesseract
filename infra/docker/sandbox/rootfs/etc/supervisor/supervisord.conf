; Started by tesseract-entrypoint as root. `user=dev` makes supervisord drop to dev before it
; opens its socket or any log file: the logs live in the dev-writable workspace volume, so a
; root supervisord would follow symlinks planted there.

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=dev
logfile=/workspace/.agent/logs/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info
pidfile=/run/supervisor/supervisord.pid
childlogdir=/workspace/.agent/logs/supervisor
minfds=65536

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
