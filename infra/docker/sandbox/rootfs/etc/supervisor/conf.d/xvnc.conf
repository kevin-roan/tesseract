[program:xvnc]
command=/usr/local/bin/theone-xvnc
user=dev
directory=/home/dev
environment=HOME="/home/dev",USER="dev",LOGNAME="dev"
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/.agent/logs/supervisor/xvnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
