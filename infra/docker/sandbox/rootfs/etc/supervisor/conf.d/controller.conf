[program:controller]
command=/usr/local/bin/tesseract-controller-run
user=dev
directory=/workspace
environment=HOME="/home/dev",USER="dev",LOGNAME="dev",SHELL="/bin/bash"
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/.agent/logs/supervisor/controller.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
