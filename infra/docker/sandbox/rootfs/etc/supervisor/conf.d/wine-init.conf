; Oneshot: creates the wine prefix on first start, exits immediately afterwards.
[program:wine-init]
command=/usr/local/bin/theone-wait-x /usr/local/bin/theone-wine-init
user=dev
directory=/home/dev
environment=HOME="/home/dev",USER="dev",LOGNAME="dev",DISPLAY="%(ENV_THEONE_DISPLAY)s"
priority=40
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/workspace/.agent/logs/supervisor/wine-init.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
