[program:openbox]
; dbus-run-session stops the session bus when openbox exits; dbus-launch leaked one per restart.
command=/usr/local/bin/tesseract-wait-x /usr/bin/dbus-run-session -- /usr/bin/openbox-session
user=dev
directory=/workspace
environment=HOME="/home/dev",USER="dev",LOGNAME="dev",SHELL="/bin/bash",DISPLAY="%(ENV_TESSERACT_DISPLAY)s"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/.agent/logs/supervisor/openbox.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
