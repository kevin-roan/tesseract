# Opt-in (--tailscale-api / TESSERACT_TAILSCALE_LOCALAPI=1) for the tailscale mode: the
# sidecar puts its LocalAPI socket on a shared volume that the sandbox mounts read-only,
# so GET /v1/identity can report the node, its owner and the tailnet. The viewer still
# comes from the serve headers. Trade-off: docs/architecture/security-model.md.
services:
  tailscale:
    environment:
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tesseract-tailscale-run:/var/run/tailscale

  sandbox:
    environment:
      TESSERACT_TAILSCALE_SOCKET: /run/tailscale/tailscaled.sock
    volumes:
      - tesseract-tailscale-run:/run/tailscale:ro

volumes:
  tesseract-tailscale-run:
    name: ${TESSERACT_VOLUME_PREFIX:-${TESSERACT_COMPOSE_PROJECT:-tesseract}}-tailscale-run
