# Base stack. Combine with exactly one reachability overlay (use infra/scripts/sandbox):
#   tailscale:       compose.yml + compose.tailscale.yml
#   host-tailscale:  compose.yml + compose.local.yml (TESSERACT_BIND_ADDR = host tailscale IP)
#   local:           compose.yml + compose.local.yml (TESSERACT_BIND_ADDR = 127.0.0.1)
# Optional: + compose.dind.yml. Variables are interpolated from ./.env (see .env.example);
# only the ones listed below reach the sandbox. TESSERACT_COMPOSE_PROJECT and
# TESSERACT_VOLUME_PREFIX isolate additional stacks (tests, more sandboxes) from the default one.
name: ${TESSERACT_COMPOSE_PROJECT:-tesseract}

services:
  sandbox:
    build:
      context: ../..
      dockerfile: infra/docker/sandbox/Dockerfile
      target: sandbox
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        WITH_ANDROID: ${WITH_ANDROID:-true}
        WITH_FLUTTER: ${WITH_FLUTTER:-true}
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.5}
        WITH_MONO: ${WITH_MONO:-true}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        WITH_WHISPER: ${WITH_WHISPER:-true}
        WHISPER_MODELS: ${WHISPER_MODELS:-base small}
    image: ${TESSERACT_IMAGE:-tesseract/sandbox:latest}
    hostname: sandbox
    restart: unless-stopped
    environment:
      TESSERACT_SANDBOX_ID: ${TESSERACT_HOSTNAME:-tesseract-sandbox}
      TESSERACT_TOKEN: ${TESSERACT_TOKEN:-}
      TESSERACT_VNC_PASSWORD: ${TESSERACT_VNC_PASSWORD:-}
      TESSERACT_DISPLAY_GEOMETRY: ${TESSERACT_DISPLAY_GEOMETRY:-1600x900}
      TESSERACT_LOG_LEVEL: ${TESSERACT_LOG_LEVEL:-info}
      TESSERACT_CLAUDE_PERMISSION_MODE: ${TESSERACT_CLAUDE_PERMISSION_MODE:-bypassPermissions}
      TESSERACT_CORS_ORIGINS: ${TESSERACT_CORS_ORIGINS:-*}
      TESSERACT_STT_ENGINE: ${TESSERACT_STT_ENGINE:-whisper.cpp}
      TESSERACT_STT_PROFILE: ${TESSERACT_STT_PROFILE:-eco}
      TESSERACT_STT_URL: ${TESSERACT_STT_URL:-}
      TESSERACT_STT_API_KEY: ${TESSERACT_STT_API_KEY:-}
      TESSERACT_STT_MODEL: ${TESSERACT_STT_MODEL:-whisper-1}
      TESSERACT_GEMINI_STT_MODEL: ${TESSERACT_GEMINI_STT_MODEL:-gemini-2.5-flash}
      TESSERACT_WHISPER_MODELS_DIR: ${TESSERACT_WHISPER_MODELS_DIR:-/opt/whisper/models}
      TESSERACT_WHISPER_MODEL: ${TESSERACT_WHISPER_MODEL:-/opt/whisper/models/ggml-model.bin}
      # Claude Code credentials for hosts whose login the bind mount below cannot carry
      # (macOS keeps it in the keychain): `claude setup-token` on the host prints the token.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - tesseract-workspace:/workspace
      - tesseract-home:/home/dev
      # The host's Claude Code dir (login, settings, sessions), shared with the host user:
      # listed after tesseract-home so it overlays /home/dev/.claude. It must exist on the host.
      - type: bind
        source: ${TESSERACT_HOST_CLAUDE_DIR:-${HOME}/.claude}
        target: /home/dev/.claude
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - AUDIT_WRITE
    shm_size: 2g
    cpus: ${SANDBOX_CPUS:-4}
    mem_limit: ${SANDBOX_MEMORY:-8g}
    pids_limit: ${SANDBOX_PIDS:-4096}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/v1/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tesseract-workspace:
    name: ${TESSERACT_VOLUME_PREFIX:-${TESSERACT_COMPOSE_PROJECT:-tesseract}}-workspace
  tesseract-home:
    name: ${TESSERACT_VOLUME_PREFIX:-${TESSERACT_COMPOSE_PROJECT:-tesseract}}-home
