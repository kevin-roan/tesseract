# Modes "local" (TESSERACT_BIND_ADDR=127.0.0.1) and "host-tailscale" (TESSERACT_BIND_ADDR = the
# host's existing tailscale IPv4). Ports are only ever bound to that single address;
# TESSERACT_CONTROLLER_HOST_PORT / TESSERACT_VNC_HOST_PORT move them for side-by-side stacks.
services:
  sandbox:
    ports:
      - "${TESSERACT_BIND_ADDR:-127.0.0.1}:${TESSERACT_CONTROLLER_HOST_PORT:-7700}:7700"
      - "${TESSERACT_BIND_ADDR:-127.0.0.1}:${TESSERACT_VNC_HOST_PORT:-5901}:5901"
    environment:
      TESSERACT_PUBLIC_URL: http://${TESSERACT_BIND_ADDR:-127.0.0.1}:${TESSERACT_CONTROLLER_HOST_PORT:-7700}
