# Mode "tailscale" (default): a userspace tailscale sidecar joins the tailnet and serves
# https://<TESSERACT_HOSTNAME>.<TS_TAILNET_DOMAIN> (443 -> controller :7700) and TCP 5901
# (VNC). The sandbox shares the sidecar's network namespace; nothing is published on
# host interfaces.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TESSERACT_HOSTNAME:-tesseract-sandbox}
    restart: unless-stopped
    # Docker copies the host's resolvers. A host on Tailscale MagicDNS lists only
    # 100.100.100.100, which a container can't reach, so every lookup in the sandbox
    # (which shares this namespace) fails with EAI_AGAIN. Name public resolvers instead.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TESSERACT_HOSTNAME:-tesseract-sandbox}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_AUTH_ONCE: "true"
    volumes:
      - tesseract-tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sandbox:
    network_mode: service:tailscale
    # Docker rejects a hostname on containers that join another container's network.
    hostname: !reset null
    depends_on:
      - tailscale
    environment:
      TESSERACT_PUBLIC_URL: https://${TESSERACT_HOSTNAME:-tesseract-sandbox}.${TS_TAILNET_DOMAIN:-}

volumes:
  tesseract-tailscale:
    name: ${TESSERACT_VOLUME_PREFIX:-${TESSERACT_COMPOSE_PROJECT:-tesseract}}-tailscale
