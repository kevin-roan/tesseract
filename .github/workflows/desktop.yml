# Builds the Electron desktop app. A push to `production` builds the Linux AppImage + deb and
# publishes them as the GitHub release `v<version>` (version from apps/electron/package.json), so
# bump the version before merging. Other runs (Actions tab, build/** branches) only upload the
# files as workflow artifacts. macOS is parked: add the `mac` entry back to the matrix to build it.
name: Desktop

on:
  workflow_dispatch:
  push:
    branches: ["production", "build/**"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            files: |
              apps/electron/dist/*.AppImage
              apps/electron/dist/*.deb
          # - platform: mac
          #   os: macos-latest
          #   files: |
          #     apps/electron/dist/*.dmg
          #     apps/electron/dist/*.zip
    env:
      RELEASE: ${{ github.ref == 'refs/heads/production' }}
      # macOS signing + notarization come from repository secrets (docs/runbooks/electron-desktop.md).
      # Without CSC_LINK dist.ts ad-hoc signs; without the APPLE_API_* secrets notarization is skipped.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      # One release per version: fail before building when v<version> is already taken.
      - if: env.RELEASE == 'true'
        run: |
          version=$(node -p "require('./apps/electron/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Release v$version already exists. Bump version in apps/electron/package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # notarytool wants the App Store Connect key as a file, so write the secret to one.
      - if: matrix.platform == 'mac' && env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - run: bun run electron:dist --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v5
        with:
          name: tesseract-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Tesseract ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ matrix.files }}
