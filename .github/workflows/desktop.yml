# Builds the Electron desktop app: the Linux AppImage + deb on Ubuntu and the macOS dmg + zip
# (universal, ad-hoc signed) on macOS. Runs on pushes to build/** branches and from the Actions
# tab (once this file is on main); a v* tag also attaches the files to a GitHub release.
name: Desktop

on:
  workflow_dispatch:
  push:
    branches: ["build/**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            files: |
              apps/electron/dist/*.AppImage
              apps/electron/dist/*.deb
          - platform: mac
            os: macos-latest
            files: |
              apps/electron/dist/*.dmg
              apps/electron/dist/*.zip
    env:
      # No Developer ID on the runner: dist.ts ad-hoc signs, so the app runs after "Open Anyway".
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run electron:dist --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
