# Builds the Electron desktop app. A push to `production` builds the Linux AppImage + deb and the
# signed, notarized macOS dmg + zip, and publishes them as the GitHub release `v<version>`
# (version from apps/electron/package.json). `bun run electron:release` bumps the version and
# pushes main to production. Other runs (Actions tab, build/** branches) only upload the files
# as workflow artifacts.
name: Desktop

on:
  workflow_dispatch:
  push:
    branches: ["production", "build/**"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            files: |
              apps/electron/dist/*.AppImage
              apps/electron/dist/*.deb
          - platform: mac
            os: macos-latest
            files: |
              apps/electron/dist/*.dmg
              apps/electron/dist/*.zip
    env:
      RELEASE: ${{ github.ref == 'refs/heads/production' }}
      # macOS signing + notarization come from repository secrets (docs/runbooks/electron-desktop.md).
      # Without the certificate dist.ts ad-hoc signs; TESSERACT_NOTARIZE=1 fails the mac build when the
      # APPLE_API_* secrets are missing instead of shipping an app Gatekeeper blocks.
      TESSERACT_NOTARIZE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      # One release per version: fail before building when v<version> is taken by another commit.
      # The same commit passes, so a failed platform job can be re-run into its release.
      - if: env.RELEASE == 'true'
        run: |
          version=$(node -p "require('./apps/electron/package.json').version")
          tagged=$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Release v$version already exists for $tagged. Bump version in apps/electron/package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Not CSC_LINK: electron-builder 26 unlocks its own keychain with the .p12 password
      # (set-key-partition-list -k), which fails. Build the keychain here and point it at the identity.
      - if: matrix.platform == 'mac' && env.MAC_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          cert="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$cert"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$cert"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::No valid Developer ID Application identity in MAC_CERT_P12_BASE64."
            exit 1
          fi
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"

      # notarytool wants the App Store Connect key as a file, so write the secret to one.
      - if: matrix.platform == 'mac' && env.APPLE_API_KEY_ID != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - run: bun run electron:dist --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v5
        with:
          name: tesseract-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Tesseract ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ matrix.files }}
