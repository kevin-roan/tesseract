plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kevinroan.tesseract'
version = '1.0.0'

android {
  namespace "com.kevinroan.tesseract.island"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
