[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-desktop"
version = "0.1.0"
description = "Tesseract desktop companion: monitor and control the sandbox from the host (GTK4 + libadwaita)"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.50", "qrcode>=7.4", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tesseract-desktop = "tesseract_desktop.app:main"

[tool.setuptools.packages.find]
include = ["tesseract_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:gi.*"]
