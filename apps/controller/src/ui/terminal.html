<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>TheOne · Terminal</title>
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body class="page">
    <header class="bar">
      <span class="status" data-status data-state="connecting">Connecting…</span>
      <span class="title" data-title>Terminal</span>
    </header>
    <main class="stage stage--terminal" data-stage></main>
    <div class="overlay" data-overlay hidden>
      <p class="overlay__text" data-overlay-text></p>
      <button class="overlay__action" type="button" data-overlay-action hidden></button>
    </div>
    <nav class="keys" data-keys aria-label="Special keys"></nav>
    <script type="module" src="./terminal.ts"></script>
  </body>
</html>
